name: Keepalive Repo By Pushing Empty Commits

on:
  schedule:
    # Runs at 00:00 on the 1st of every month (safe within 60-day limit)
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: reset 60-day inactivity timer"
          git push
